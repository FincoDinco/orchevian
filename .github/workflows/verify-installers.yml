name: Verify installed downloads

on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.os }}
          path: downloads
      - name: Install OS libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # Fresh hosted runner: no uv sync, PySide, llama.cpp, MLX or Ollama installation.
      # Python here only runs the standard-library verification harness.
      - name: Check the installed app and bundled runtimes
        shell: bash
        run: python3 scripts/check_installer.py --downloads downloads --report dist/install-smoke-report.json --disposable-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-${{ inputs.artifact-prefix }}-${{ matrix.os }}
          path: dist/install-smoke-report.json
          if-no-files-found: error
