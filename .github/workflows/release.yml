name: Release

# Push a version tag (for example v1.0.0) to build the downloads for every
# platform and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Install Qt system libraries and appimagetool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          curl -fLsS -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          # Runners have no FUSE; the tool runs extracted instead.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      # A release is never published unsigned: this fails if the secrets are missing.
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          REQUIRE_SIGNING: "true"
        run: bash scripts/ci_apple_signing.sh
      # llama.cpp compiles from source here (a few minutes); MLX installs only on Apple Silicon.
      - run: uv sync --locked --no-default-groups --extra gui --extra mlx --extra gguf --group packaging
      - run: uv run --no-sync python scripts/build_desktop.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  verify:
    needs: build
    uses: ./.github/workflows/verify-installers.yml
    with:
      artifact-prefix: download
      require-notarized: true

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    # Only this job can write, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          # Just the three installers, and one checksum list instead of a file beside each.
          cat downloads/*.sha256 > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" downloads/*.dmg downloads/*-setup.exe \
            downloads/*.AppImage SHA256SUMS.txt \
            --title "Orchevian ${GITHUB_REF_NAME#v}" --notes-file notes.md
