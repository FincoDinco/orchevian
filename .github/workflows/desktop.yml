name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --no-default-groups --extra gui --group packaging
      - run: uv run --no-sync python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/smoke-report.json
          if-no-files-found: error
