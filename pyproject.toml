[project]
name = "llm-engine"
version = "0.1.0"
description = "Local-first engine for LLM Manager"
readme = "README.md"
authors = [
    { name = "Seth Hardin", email = "personal@sethhardin.com" },
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
gguf = ["llama-cpp-python"]

[project.scripts]
llm-engine = "llm_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["llm_engine"]
