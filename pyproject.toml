[project]
name = "llm-engine"
version = "0.1.0"
description = "Local-first engine for LLM Manager"
readme = "README.md"
authors = [
    { name = "Seth Hardin", email = "personal@sethhardin.com" },
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
gguf = ["llama-cpp-python"]
gui = ["PySide6>=6.7", "markdown>=3.7"]

[project.scripts]
llm-engine = "llm_engine.cli:main"
llm-manager = "llm_manager_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "PySide6>=6.7",
    "markdown>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["llm_engine", "llm_manager_app"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_engine", "src/llm_manager_app"]

[tool.hatch.build.targets.wheel.force-include]
"src/llm_engine/store/schema.sql" = "llm_engine/store/schema.sql"
