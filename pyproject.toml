[project]
name = "orchevian"
version = "0.1.0"
description = "A private, local-first AI workspace: chat with local models, your files, and the web, create documents, and keep a personal knowledge base."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Seth Hardin", email = "personal@sethhardin.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1",
    "pillow>=11.3,<13",
    "pypdfium2>=4.30,<6",
    "uvicorn>=0.34",
    "python-pptx>=1.0,<2",
    "reportlab>=4.4,<5",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
mlx = ["mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'"]
gguf = ["llama-cpp-python"]
gui = ["PySide6>=6.7", "markdown>=3.7"]

[project.scripts]
orchevian = "llm_manager_app.__main__:main"
orchevian-engine = "llm_engine.cli:main"
# Keep existing launchers working after the rename.
llm-engine = "llm_engine.cli:main"
llm-manager = "llm_manager_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
packaging = ["pyinstaller>=6.16,<7"]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "PySide6>=6.7",
    "markdown>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["llm_engine", "llm_manager_app"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_engine", "src/llm_manager_app"]

[tool.hatch.build.targets.wheel.force-include]
"src/llm_engine/store/schema.sql" = "llm_engine/store/schema.sql"
